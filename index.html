/* =========================================================
   HELPERS
   ========================================================= */
function normalize(text) {
  text = text.toLowerCase().trim();
  text = text.replace(/[?!.,।;:'"()\[\]{}]/g, " ");
  text = text.replace(/\s+/g, " ");
  return text;
}

function tokenize(text) {
  const words = normalize(text).split(" ");
  const result = [];
  words.forEach(w => {
    if (!w) return;
    if (STOP_WORDS.has(w)) return;
    const syn = SYNONYMS[w] || w;
    if (!result.includes(syn)) result.push(syn);
  });
  return result;
}

function levenshtein(a, b) {
  if (a.length === 0) return b.length;
  if (b.length === 0) return a.length;
  const matrix = [];
  for (let i = 0; i <= b.length; i++) matrix[i] = [i];
  for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      if (b.charAt(i - 1) === a.charAt(j - 1)) {
        matrix[i][j] = matrix[i - 1][j - 1];
      } else {
        matrix[i][j] = Math.min(
          matrix[i - 1][j - 1] + 1,
          matrix[i][j - 1] + 1,
          matrix[i - 1][j] + 1
        );
      }
    }
  }
  return matrix[b.length][a.length];
}

function fuzzyScore(word1, word2) {
  if (word1 === word2) return 1;
  if (word1.length < 3 || word2.length < 3) return 0;
  const dist = levenshtein(word1, word2);
  const maxLen = Math.max(word1.length, word2.length);
  return 1 - dist / maxLen;
}

function isFollowUp(text) {
  const t = normalize(text);
  return (
    t.includes("kitne ka") || t.includes("kitne ki") || t.includes("price") ||
    t.includes("cost") || t.includes("kitna") || t.includes("kitne din") ||
    t.includes("time") || t.includes("timeline") || t.includes("iska") ||
    t.includes("uska") || t.includes("ye bhi") || t.includes("aur ye") ||
    t.length <= 8
  );
}

function detectFollowUpIntent(text) {
  const t = normalize(text);
  if (t.includes("price") || t.includes("kitne ka") || t.includes("kitne ki") ||
      t.includes("cost") || t.includes("charge") || t.includes("kitna") ||
      t.includes("budget") || t.includes("rate") || t.includes("daam")) return "price";
  if (t.includes("time") || t.includes("din") || t.includes("kitne din") ||
      t.includes("timeline") || t.includes("kab") || t.includes("duration")) return "timeline";

}

/* =========================================================
   FIND ANSWER
   ========================================================= */
function findAnswer(userText) {
  const userTokens = tokenize(userText);
  if (userTokens.length === 0) return "Aap kuch likhiye ya boliye, main aapki madad karungi. 🙏";

  if (isFollowUp(userText) && conversationContext.lastService) {
    const intent = detectFollowUpIntent(userText);
    if (intent === "price") return getPriceForService(conversationContext.lastService);
    if (intent === "timeline") return getTimelineForService(conversationContext.lastService);
    if (conversationContext.lastTopic) {
      const lastKB = KB.find(k => k.topic === conversationContext.lastTopic);
      if (lastKB) return lastKB.answer;
    }
  }

  let bestMatch = null;
  let bestScore = 0;

  KB.forEach(item => {
    let score = 0;
    const triggerTokens = new Set();
    item.triggers.forEach(trg => tokenize(trg).forEach(t => triggerTokens.add(t)));
    item.topic.split("_").forEach(w => triggerTokens.add(w));

    userTokens.forEach(uTok => {
      if (triggerTokens.has(uTok)) score += 6;
      triggerTokens.forEach(tTok => {
        const fs = fuzzyScore(uTok, tTok);
        if (fs >= 0.75) score += 4 * fs;
      });
    });

    if (score > bestScore) { bestScore = score; bestMatch = item; }
  });

  if (bestMatch && bestScore >= 3) {
    conversationContext.lastTopic = bestMatch.topic;
    conversationContext.lastService = bestMatch.topic;
    return bestMatch.answer;
  }

  return "माफ़ कीजिए, इस जानकारी की मेरे पास अभी पुष्टि नहीं है। हमारी team आपको इसकी exact जानकारी उपलब्ध करवा सकती है, या आप किसी service ke bare me specific puch sakte ho. 😊";
}

/* =========================================================

   ========================================================= */
let femaleVoice = null;

function loadFemaleVoice() {
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;

  // 🔥 Priority list - best female Hindi voices (best se worst tak)
  const priorityList = [
    // Android / Chrome (Best quality)
    { name: "google हिन्दी", lang: "hi" },
    { name: "google hindi", lang: "hi" },
    // Windows (Microsoft Swara - best female)
    { name: "swara", lang: "hi" },
    { name: "microsoft swara", lang: "hi" },
    // Mac/iOS
    { name: "lekha", lang: "hi" },
    // Edge
    { name: "neerja", lang: "hi" },
    { name: "microsoft neerja", lang: "hi" },
    // Older Microsoft
    { name: "kalpana", lang: "hi" },
    { name: "heera", lang: "hi" },
    // Fallback female
    { name: "female", lang: "hi" },
    { name: "zira", lang: "en-IN" },
    { name: "samantha", lang: "en" }
  ];

  // Step 1: Priority voice dhoondo
  for (const item of priorityList) {
    const v = voices.find(vo =>
      vo.name.toLowerCase().includes(item.name) &&
      (vo.lang.toLowerCase().includes(item.lang) || vo.lang.toLowerCase().includes("in"))
    );
    if (v) {
      femaleVoice = v;
      console.log("✅ Female Voice Selected:", v.name, "|", v.lang);
      return;
    }
  }

  // Step 2: Koi bhi Hindi voice
  const hindiVoice = voices.find(vo => vo.lang.toLowerCase().includes("hi"));
  if (hindiVoice) {
    femaleVoice = hindiVoice;
    console.log("✅ Hindi Voice:", hindiVoice.name);
    return;
  }

  // Step 3: Indian English voice
  const indianVoice = voices.find(vo => vo.lang.toLowerCase().includes("en-in"));
  if (indianVoice) {
    femaleVoice = indianVoice;
    console.log("✅ Indian Voice:", indianVoice.name);
    return;
  }

  // Step 4: Koi bhi female voice
  const anyFemale = voices.find(vo =>
    vo.name.toLowerCase().includes("female") ||
    vo.name.toLowerCase().includes("zira") ||
    vo.name.toLowerCase().includes("samantha") ||
    vo.name.toLowerCase().includes("google")
  );
  if (anyFemale) {
    femaleVoice = anyFemale;
    console.log("⚠️ Female fallback:", anyFemale.name);
    return;
  }

  // Step 5: Last fallback
  if (voices.length) {
    femaleVoice = voices[0];
    console.log("⚠️ Last fallback:", femaleVoice.name);
  }
}

/* =========================================================
   SPEAK - Natural Female Voice
   ========================================================= */
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  if (!femaleVoice) loadFemaleVoice();

  // Safari/Chrome bug fix
  window.speechSynthesis.cancel();

  // Emoji + symbols + markdown remove
  const cleanText = text
    .replace(/[\u{1F600}-\u{1F6FF}]/gu, "")
    .replace(/[\u{2600}-\u{26FF}]/gu, "")
    .replace(/[\u{2700}-\u{27BF}]/gu, "")
    .replace(/[\u{1F900}-\u{1F9FF}]/gu, "")
    .replace(/[*_#`~|]/g, "")
    .replace(/₹/g, " rupees ")
    .replace(/\n+/g, ". ")
    .replace(/\s+/g, " ")
    .trim();

  if (!cleanText) return;

  const utter = new SpeechSynthesisUtterance(cleanText);

  // 🔥 NATURAL FEMALE VOICE SETTINGS
  utter.lang = "hi-IN";
  utter.rate = 0.92;      // thodi dheemi = natural
  utter.pitch = 1.05;     // female tone (natural, robotic nahi)
  utter.volume = 1.0;

  if (femaleVoice) {
    utter.voice = femaleVoice;
  }

  // Chrome bug fix: chhota delay
  setTimeout(() => {
    window.speechSynthesis.speak(utter);
  }, 50);
}

window.addEventListener('load', () => {
  loadFemaleVoice();
  // Chrome warm-up (pehli baar voice nahi bajti)
  const warmup = new SpeechSynthesisUtterance(" ");
  warmup.volume = 0;
  warmup.lang = "hi-IN";
  window.speechSynthesis.speak(warmup);
});

   MAIN HANDLER
   ========================================================= */
function handleSend() {
  const text = userInput.value.trim();
  if (!text) return;
  addMessage(text, "user");
  userInput.value = "";
  setTimeout(() => {
    const answer = findAnswer(text);
    addMessage(answer, "bot");
    speak(answer);
  }, 350);
}

sendBtn.addEventListener("click", handleSend);
userInput.addEventListener("keypress", e => { if (e.key === "Enter") handleSend(); });

/* =========================================================
   SPEECH TO TEXT
   ========================================================= */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
  const recognition = new SpeechRecognition();
  recognition.lang = "hi-IN";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  let recording = false;

  micBtn.addEventListener("click", () => {
    if (recording) { recognition.stop(); return; }
    recognition.start();
  });

  recognition.onstart = () => {
    recording = true;
    micBtn.classList.add("recording");
    micBtn.textContent = "⏹";
  };

  recognition.onend = () => {
    recording = false;
    micBtn.classList.remove("recording");
    micBtn.textContent = "🎤";
  };

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    userInput.value = transcript;
    handleSend();
  };

  recognition.onerror = () => {
    addMessage("Mic me problem aa gayi. Please dobara try karo.", "bot");
  };
} else {
  micBtn.style.display = "none";
}
