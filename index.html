    font-size: 14px;
    transition: 0.2s;

    border: none;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
  }
  .btn:hover { transform: scale(1.08); }
  .btn:active { transform: scale(0.95); }

    background: #e74c3c;

  }

    70% { box-shadow: 0 0 0 15px rgba(231,76,60,0); }
    100% { box-shadow: 0 0 0 0 rgba(231,76,60,0); }

/* =========================================================
   NORMALIZE
   ========================================================= */
function normalize(text) {
  text = text.toLowerCase().trim();
  text = text.replace(/[?!.,।;:'"()\[\]{}]/g, " ");
  text = text.replace(/\s+/g, " ");
  return text;
}

/* =========================================================
   TOKENIZE
   ========================================================= */
function tokenize(text) {
  const words = normalize(text).split(" ");
  const result = [];
  words.forEach(w => {
    if (!w) return;
    if (STOP_WORDS.has(w)) return;
    const syn = SYNONYMS[w] || w;
    if (!result.includes(syn)) result.push(syn);
  });
  return result;
}

/* =========================================================
   LEVENSHTEIN
   ========================================================= */
function levenshtein(a, b) {
  if (a.length === 0) return b.length;
  if (b.length === 0) return a.length;
  const matrix = [];
  for (let i = 0; i <= b.length; i++) matrix[i] = [i];
  for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      if (b.charAt(i - 1) === a.charAt(j - 1)) {
        matrix[i][j] = matrix[i - 1][j - 1];
      } else {
        matrix[i][j] = Math.min(
          matrix[i - 1][j - 1] + 1,
          matrix[i][j - 1] + 1,
          matrix[i - 1][j] + 1
        );
      }
    }
  }
  return matrix[b.length][a.length];
}

/* =========================================================
   FUZZY SCORE
   ========================================================= */
function fuzzyScore(word1, word2) {
  if (word1 === word2) return 1;
  if (word1.length < 3 || word2.length < 3) return 0;
  const dist = levenshtein(word1, word2);
  const maxLen = Math.max(word1.length, word2.length);
  return 1 - dist / maxLen;
}

/* =========================================================
   FIND ANSWER - Smart Fallback ke saath
   ========================================================= */
function findAnswer(userText) {
  const userTokens = tokenize(userText);
  if (userTokens.length === 0) {
    return "Aap kuch likhiye ya boliye, main aapki madad karungi. 🙏";
  }

  let bestMatch = null;
  let bestScore = 0;

  faqData.forEach(faq => {
    let score = 0;

    const kwTokens = new Set();
    faq.keywords.forEach(kw => {
      tokenize(kw).forEach(t => kwTokens.add(t));
    });

    const qTokens = new Set(tokenize(faq.question));

    userTokens.forEach(uTok => {
      if (kwTokens.has(uTok)) score += 5;
      if (qTokens.has(uTok)) score += 3;

      kwTokens.forEach(kTok => {
        const fs = fuzzyScore(uTok, kTok);
        if (fs >= 0.75) score += 3 * fs;
      });

      qTokens.forEach(qTok => {
        const fs = fuzzyScore(uTok, qTok);
        if (fs >= 0.75) score += 2 * fs;
      });
    });

    if (score > bestScore) {
      bestScore = score;
      bestMatch = faq;
    }
  });

  // Exact/close match mila
  if (bestMatch && bestScore >= 2) return bestMatch.answer;

  // Koi match nahi mila — COMPANY SUMMARY de do
  return COMPANY_SUMMARY;
}

const chatBox = document.getElementById("chatBox");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");

function addMessage(text, sender) {
  const div = document.createElement("div");
  div.className = "msg " + sender;
  div.textContent = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

/* =========================================================
   TEXT TO SPEECH - Female voice
   ========================================================= */
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "hi-IN";
  utter.rate = 0.95;
  utter.pitch = 1.15;  // female tone
  utter.volume = 1;

  // Female voice dhoondo (agar available ho)
  const voices = window.speechSynthesis.getVoices();
  const femaleVoice = voices.find(v => 
    v.lang.includes("hi") && v.name.toLowerCase().includes("female")
  ) || voices.find(v => 
    v.lang.includes("hi")
  ) || voices.find(v => 
    v.lang.includes("en-IN")
  );
  if (femaleVoice) utter.voice = femaleVoice;

  window.speechSynthesis.speak(utter);
}

// Voices load hone ka wait
window.speechSynthesis.onvoiceschanged = () => {
  window.speechSynthesis.getVoices();
};

/* =========================================================
   MAIN HANDLER
   ========================================================= */
function handleSend() {
  const text = userInput.value.trim();
  if (!text) return;

  addMessage(text, "user");
  userInput.value = "";

  setTimeout(() => {
    const answer = findAnswer(text);
    addMessage(answer, "bot");
    speak(answer);
  }, 400);
}

sendBtn.addEventListener("click", handleSend);
userInput.addEventListener("keypress", e => {
  if (e.key === "Enter") handleSend();
});

/* =========================================================
   SPEECH TO TEXT
   ========================================================= */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
  const recognition = new SpeechRecognition();
  recognition.lang = "hi-IN";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  let recording = false;

  micBtn.addEventListener("click", () => {
    if (recording) {
      recognition.stop();
      return;
    }
    recognition.start();
  });

  recognition.onstart = () => {
    recording = true;
    micBtn.classList.add("recording");
    micBtn.textContent = "⏹";
  };

  recognition.onend = () => {
    recording = false;
    micBtn.classList.remove("recording");
    micBtn.textContent = "🎤";
  };

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    userInput.value = transcript;
    handleSend();
  };

  recognition.onerror = (event) => {
    console.error("Mic error:", event.error);
    addMessage("Mic me problem aa gayi. Please dobara try karo.", "bot");
  };
} else {
  micBtn.style.display = "none";
  console.warn("Is browser me Speech Recognition support nahi hai.");
}
